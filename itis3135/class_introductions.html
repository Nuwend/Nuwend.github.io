<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Musa | ITIS 3135 | Class Mascot Gallery</title>
    <link rel="stylesheet" href="../styles/default.css">
    <link rel="icon" type="image/png" href="../images/stupidthing.png">
    <script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Div and ids: the footer-placeholder div and the header-placeholder and footer-placeholder ids mark where the shared header and footer load. The ids mascots, search, status, and cards let the script and the stylesheet find the page, the search box, the status message, and the list of cards. No classes, spans, or inline styles are used. -->
    <header id="header-placeholder"></header>

    <main id="mascots">
        <h2>Class Mascot Gallery</h2>
        <p>Every card below was built live from a classmate’s introduction, pulled from the class server. Search by name, mascot, or a word from a quote to find someone.</p>

        <label for="search">Search the gallery</label>
        <input type="search" id="search" placeholder="Try a name, an animal, or a word from a quote">

        <p id="status" role="status">Loading the gallery...</p>
        <ul id="cards"></ul>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../includes/header.html')
            .then((response) => response.text())
            .then((html) => {
                document.getElementById('header-placeholder').innerHTML = html;
                const pageName = document.title.split('|').pop().trim();
                document.querySelector('#header-placeholder h1').textContent += ' | ' + pageName;
            });
    </script>

    <script>
        fetch('../includes/footer.html')
            .then((response) => response.text())
            .then((html) => {
                document.getElementById('footer-placeholder').innerHTML = html;
            });
    </script>

    <script src="../scripts/mascots.js"></script>
</body>
</html>
